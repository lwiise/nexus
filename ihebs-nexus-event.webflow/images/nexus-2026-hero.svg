<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="crowdGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8f4ff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#9fb8cc" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#20344a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a6cd6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#123f8a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="whiteSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#dceaf5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="78%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="dotMask">
      <rect width="1920" height="1080" fill="url(#dotFade)"/>
    </mask>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.4" fill="#cfe0ee"/>
    </pattern>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="xmark">
      <path d="M0 3 L7 10 L0 17 M17 3 L10 10 L17 17" fill="none" stroke="#38c6f4" stroke-width="4"/>
    </g>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="#030507"/>

  <!-- right-side crowd suggestion -->
  <g>
    <ellipse cx="1620" cy="300" rx="430" ry="330" fill="url(#crowdGlow)"/>
    <ellipse cx="1760" cy="720" rx="360" ry="420" fill="url(#blueGlow)"/>
    <ellipse cx="1500" cy="880" rx="420" ry="260" fill="url(#blueGlow)" opacity="0.7"/>
    <ellipse cx="1665" cy="520" rx="60" ry="42" fill="url(#whiteSpot)"/>
    <ellipse cx="1815" cy="640" rx="26" ry="20" fill="url(#whiteSpot)" opacity="0.8"/>
    <rect width="1920" height="1080" fill="url(#halftone)" mask="url(#dotMask)" opacity="0.16"/>
  </g>

  <!-- neon diagonal linework, top-left -->
  <g stroke-linecap="square" fill="none">
    <g filter="url(#neon)" stroke="#2fbdf0">
      <path d="M-60 40 L560 660" stroke-width="5"/>
      <path d="M-60 -40 L640 660" stroke-width="3" opacity="0.9"/>
      <path d="M40 -60 L470 370" stroke-width="7"/>
      <path d="M130 -60 L400 210" stroke-width="3"/>
      <path d="M215 -60 L520 245" stroke-width="5" opacity="0.85"/>
      <path d="M300 -60 L515 155" stroke-width="2.5" opacity="0.8"/>
    </g>
    <g stroke="#123a5e">
      <path d="M-60 130 L520 710" stroke-width="10" opacity="0.8"/>
      <path d="M-60 240 L400 700" stroke-width="6" opacity="0.7"/>
      <path d="M390 -60 L640 190" stroke-width="9" opacity="0.7"/>
      <path d="M470 -60 L700 170" stroke-width="4" opacity="0.6"/>
    </g>
  </g>

  <!-- faint brand X + chevrons, lower-left -->
  <g fill="none">
    <g stroke="#1d5c8f" opacity="0.55">
      <path d="M330 470 L560 700 M560 470 L330 700" stroke-width="10"/>
    </g>
    <g stroke="#2fbdf0" filter="url(#neon)" opacity="0.9">
      <path d="M60 690 L200 830 L60 970" stroke-width="6"/>
      <path d="M130 690 L270 830 L130 970" stroke-width="3.5" opacity="0.8"/>
    </g>
    <g stroke="#123a5e" opacity="0.7">
      <path d="M200 690 L340 830 L200 970" stroke-width="8"/>
    </g>
  </g>

  <!-- title block -->
  <g fill="#ffffff" font-family="'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900">
    <text x="96" y="290" font-size="168" letter-spacing="2">NEXUS</text>
    <text x="96" y="452" font-size="168" letter-spacing="2">2026</text>
    <text x="98" y="560" font-size="52" letter-spacing="1">21 WORLD-CLASS DJS</text>
  </g>

  <!-- footer block -->
  <g font-family="'Geist','Helvetica Neue',Arial,sans-serif" fill="#ffffff">
    <text x="98" y="878" font-size="32" font-weight="600">Nexus experiences</text>
    <text x="470" y="878" font-size="32" font-weight="600">Kosove, Viti</text>
    <text x="94" y="972" font-size="76" font-weight="800" font-family="'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif">23-24-25 JULY</text>
  </g>

  <!-- lineup columns -->
  <g fill="#ffffff" font-family="'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="35">
    <g>
      <use href="#xmark" x="905" y="118"/><text x="955" y="136">ANTHO DECKS</text>
      <use href="#xmark" x="905" y="171"/><text x="955" y="189">BEN RODD</text>
      <use href="#xmark" x="905" y="224"/><text x="955" y="242">MIDIO</text>
      <use href="#xmark" x="905" y="277"/><text x="955" y="295">LUCAS BRANCO</text>
      <use href="#xmark" x="905" y="330"/><text x="955" y="348">BOBBYYNAY</text>
      <use href="#xmark" x="905" y="383"/><text x="955" y="401">AMORFIA</text>
      <use href="#xmark" x="905" y="436"/><text x="955" y="454">DEVI</text>
      <use href="#xmark" x="905" y="489"/><text x="955" y="507">YUKO</text>
      <use href="#xmark" x="905" y="542"/><text x="955" y="560">ROBERTO FERRARO</text>
      <use href="#xmark" x="905" y="595"/><text x="955" y="613">GENJI YOSHIDA</text>
    </g>
    <g>
      <use href="#xmark" x="1390" y="118"/><text x="1440" y="136">ANABEL SIGEL</text>
      <use href="#xmark" x="1390" y="171"/><text x="1440" y="189">MENDO</text>
      <use href="#xmark" x="1390" y="224"/><text x="1440" y="242">ALMA HOSCH</text>
      <use href="#xmark" x="1390" y="277"/><text x="1440" y="295">DELTECH</text>
      <use href="#xmark" x="1390" y="330"/><text x="1440" y="348">TORNADOTONI</text>
      <use href="#xmark" x="1390" y="383"/><text x="1440" y="401">XHORXHO</text>
      <use href="#xmark" x="1390" y="436"/><text x="1440" y="454">DJAZZ</text>
      <use href="#xmark" x="1390" y="489"/><text x="1440" y="507">DEEETRO</text>
      <use href="#xmark" x="1390" y="542"/><text x="1440" y="560">ARMIR BASHOTA</text>
      <use href="#xmark" x="1390" y="595"/><text x="1440" y="613">FEVZEE</text>
      <use href="#xmark" x="1390" y="648"/><text x="1440" y="666">LEDION</text>
    </g>
  </g>
</svg>
